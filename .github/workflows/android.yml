name: Android CI

# 云端编译：push 即出 debug APK（Actions → Artifacts 下载），
# 本地无需装 Android SDK。
on:
  push:
    branches: ["v2-adapt", "main", "pr_version"]
  pull_request:
    branches: ["v2-adapt", "main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 注：不装 setup-android——ubuntu runner 自带完整 SDK，
      # 而 android-actions/setup-android@v3 会去装已下架的 tools 包导致失败。
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OConnector-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
